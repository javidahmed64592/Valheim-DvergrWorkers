name: Package for Thunderstore

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build & Package
        run: bash package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAMESPACE }}-${{ env.NAME }}-${{ env.VERSION }}
          path: dist/${{ env.NAMESPACE }}-${{ env.NAME }}-${{ env.VERSION }}/
